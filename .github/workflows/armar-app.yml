name: Armar app Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar archivos de Android
        run: |
          flutter create --platforms=android --org com.labappsch --project-name kioku .
          rm -f test/widget_test.dart
          sed -i 's/android:label="kioku"/android:label="Kioku"/' android/app/src/main/AndroidManifest.xml
          # Firebase necesita Android 6.0 (versión 23) o superior.
          sed -i -E 's/minSdk = flutter\.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 23)/' android/app/build.gradle.kts
          grep -n "minSdk" android/app/build.gradle.kts

      - name: Revisar el código
        run: |
          flutter pub get
          grep -A3 -E "^  (firebase_core|firebase_auth|cloud_firestore):" pubspec.lock | grep -E "^  [a-z_]+:|version"
          flutter analyze --no-fatal-infos

      - name: Usar siempre la misma llave de firma
        run: |
          python3 android-signing/configurar_firma.py
          grep -n -A6 "signingConfigs {" android/app/build.gradle.kts
          grep -n "signingConfig =" android/app/build.gradle.kts

      - name: Armar el APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk kioku.apk

      - name: Comprobar que la firma es la correcta
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs kioku.apk | tee firma.txt
          # Huella de android-signing/debug.keystore (SHA-256).
          grep -qi "8a7547700701afacfc59ae62c68c8058b3ac5ef5f7024039efcb2207a6d8439f" firma.txt \
            || { echo "La firma no coincide con android-signing/debug.keystore"; exit 1; }

      - name: Guardar el APK en esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: kioku-apk
          path: kioku.apk

      - name: Publicar versión descargable
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          MENSAJE: ${{ github.event.head_commit.message || 'ejecución manual' }}
          NUMERO: ${{ github.run_number }}
        run: |
          gh release create "prueba-$NUMERO" kioku.apk \
            --title "Kioku - versión de prueba $NUMERO" \
            --notes "Cambio: $MENSAJE" \
            --latest
