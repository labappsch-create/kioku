name: kioku
description: "Kioku: app para el karate Kyokushin."
publish_to: "none"

version: 0.10.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # "any": GitHub elige la versión más nueva compatible al armar la app.
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_storage: any
  image_picker: any

dev_dependencies:
  flutter_launcher_icons: any
  flutter_native_splash: any

flutter:
  uses-material-design: true
  assets:
    - assets/bienvenida.jpg
    - assets/icono/icono.png

# Ícono de la app (se genera en GitHub al armar la app).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icono/icono.png"
  min_sdk_android: 23
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icono/icono_frente.png"

# Lo primero que muestra Android al tocar el ícono (antes de la bienvenida).
flutter_native_splash:
  color: "#000000"
  image: assets/icono/splash.png
  android_12:
    color: "#000000"
    image: assets/icono/splash_12.png
  ios: false
  web: false
